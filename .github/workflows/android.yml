
name: Build POGO PRO MENU APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extraire le projet
        run: |
          unzip -o POGO_PRO_MENU_Projet_Android.zip -d source

      - name: Compiler APK
        working-directory: source/POGO_PRO_MENU
        run: gradle assembleDebug

      - name: Récupérer APK
        uses: actions/upload-artifact@v4
        with:
          name: POGO-PRO-MENU-APK
          path: source/POGO_PRO_MENU/app/build/outputs/apk/debug/app-debug.apk

